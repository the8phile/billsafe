<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#4F46E5">

<title>BillSafe — Partage Compteur</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#4F46E5;--purple-dark:#3730A3;--purple-dim:rgba(79,70,229,0.1);
  --violet:#7C3AED;--blue:#2563EB;
  --bg:#F5F5FA;--surface:#FFFFFF;--surface2:#F8F8FF;
  --dark:#1E1B4B;--dark2:#312E81;
  --text:#1E1B4B;--text2:#6B7280;--text3:#9CA3AF;
  --green:#10B981;--green-bg:rgba(16,185,129,0.1);
  --red:#EF4444;--red-bg:rgba(239,68,68,0.1);
  --amber:#F59E0B;--amber-bg:rgba(245,158,11,0.1);
  --white:#FFFFFF;--nav-h:72px;
  --radius:20px;--radius-sm:14px;
  --shadow:0 2px 12px rgba(79,70,229,0.08);
  --f:'Inter',sans-serif;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:var(--nav-h)}
.app{min-height:100vh;max-width:430px;margin:0 auto}
@media(min-width:769px){.app{box-shadow:0 0 40px rgba(0,0,0,0.12)}}
.page-header{background:linear-gradient(145deg,#4F46E5 0%,#7C3AED 100%);padding:env(safe-area-inset-top,44px) 20px 28px;position:relative;overflow:hidden}
.page-header::before{content:'';position:absolute;top:-40px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,0.06);border-radius:50%}
.ph-row{display:flex;align-items:center;gap:14px;padding-top:8px;position:relative;z-index:1}
.back-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.page-title{font-size:18px;font-weight:700;color:#fff;flex:1}
.ph-action{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ph-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-top:4px;padding-left:52px;position:relative;z-index:1}
.content{padding:20px 16px}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-dark{background:linear-gradient(135deg,#1E1B4B,#312E81);color:#fff}
.card-purple{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
.card-dark .card-title,.card-purple .card-title{color:#fff}
.card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.05em}
.form-input{width:100%;padding:14px 16px;border:1.5px solid #E5E7EB;border-radius:var(--radius-sm);font-size:15px;font-family:var(--f);background:var(--surface2);color:var(--text);outline:none;transition:all 0.2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,0.1)}
select.form-input{cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;font-size:15px;font-weight:700;font-family:var(--f);border:none;border-radius:var(--radius-sm);cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,0.35);transition:all 0.2s;margin-top:6px}
.btn-primary:active{transform:scale(0.98)}
.btn-ghost{width:100%;padding:14px;background:transparent;border:1.5px solid #E5E7EB;color:var(--text2);font-size:14px;font-weight:600;font-family:var(--f);border-radius:var(--radius-sm);cursor:pointer;margin-top:8px}
.btn-sm{padding:9px 18px;border-radius:100px;font-size:13px;font-weight:700;font-family:var(--f);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:all 0.2s}
.btn-sm:active{transform:scale(0.95)}
.btn-sm-purple{background:var(--purple);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,0.3)}
.btn-sm-ghost{background:var(--purple-dim);color:var(--purple)}
.btn-sm-red{background:var(--red-bg);color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px}
.pill-paid{background:var(--green-bg);color:var(--green)}
.pill-pending{background:var(--amber-bg);color:var(--amber)}
.pill-active{background:var(--green-bg);color:var(--green)}
.pill-inactive{background:#F3F4F6;color:var(--text2)}
.li-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ic-eneo{background:linear-gradient(135deg,#FEF08A,#EAB308)}
.ic-camwater{background:linear-gradient(135deg,#BAE6FD,#0284C7)}
.ic-camtel{background:linear-gradient(135deg,#DDD6FE,#7C3AED)}
.ic-green{background:linear-gradient(135deg,#BBF7D0,#10B981)}
.ic-purple{background:linear-gradient(135deg,#E0E7FF,#4F46E5)}
.ic-amber{background:var(--amber-bg)}
.ic-gray{background:#F3F4F6}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.av-purple{background:var(--purple-dim);color:var(--purple)}
.av-green{background:var(--green-bg);color:var(--green)}
.av-amber{background:var(--amber-bg);color:var(--amber)}
.empty-state{text-align:center;padding:48px 24px}
.empty-state .ei{font-size:48px;margin-bottom:14px;display:block}
.empty-state h3{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text3);line-height:1.6}
.skeleton{background:linear-gradient(90deg,#F3F4F6 25%,#E9EAEC 50%,#F3F4F6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,44px)+8px);left:16px;right:16px;background:#1E1B4B;color:#fff;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.2);transform:translateY(-80px);opacity:0;transition:all 0.3s;z-index:9999;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:28px 28px 0 0;width:100%;padding:20px 20px 40px;transform:translateY(30px);transition:transform 0.3s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:#E5E7EB;border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:18px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;height:var(--nav-h);background:var(--white);border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:stretch;z-index:1000;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 24px rgba(0,0,0,0.08)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:var(--f);-webkit-tap-highlight-color:transparent;transition:color 0.15s;position:relative}
.bn-item.active{color:var(--purple)}
.bn-item.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--purple);border-radius:0 0 4px 4px}
.bn-item i{font-size:22px;transition:transform 0.15s}
.bn-item.active i{transform:scale(1.1)}
.bn-fab{flex:0 0 60px}
.bn-fab-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(79,70,229,0.45);border:3px solid #fff;position:relative;top:-10px}
.bn-fab-circle i{font-size:24px;color:#fff}
.bn-fab::before{display:none!important}

</style></head><body>
<div class="app">
<div class="page-header">
  <div class="ph-row">
    <button class="back-btn" onclick="history.back()"><i class="ph ph-arrow-left"></i></button>
    <span class="page-title">Partage Compteur</span>
    <button class="ph-action" onclick="openM('modal-group')"><i class="ph ph-plus"></i></button>
  </div>
  <div class="ph-sub">Un compteur, plusieurs voisins, zéro dispute</div>
</div>
<div class="content">

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
    <div class="card card-dark" style="padding:16px">
      <div style="font-size:26px;font-weight:800;color:#818CF8" id="s-groups">—</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">Groupes</div>
    </div>
    <div class="card card-purple" style="padding:16px">
      <div style="font-size:26px;font-weight:800;color:#fff" id="s-splits">—</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">Partages</div>
    </div>
  </div>

  <!-- GROUPS -->
  <div id="groups-list"><div class="skeleton" style="height:80px;margin-bottom:10px"></div><div class="skeleton" style="height:80px"></div></div>

  <!-- CALCULATOR (shown when group selected) -->
  <div id="calc-section" style="display:none">
    <div class="card card-dark" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:12px" id="calc-group-name">—</div>
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label" style="color:rgba(255,255,255,0.5)">Montant total (FCFA)</label>
        <input class="form-input" type="number" id="calc-total" placeholder="45000" oninput="recalc()" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15);color:#fff">
      </div>
      <!-- METHOD TABS -->
      <div style="display:flex;gap:6px;margin-bottom:14px">
        <button class="btn-sm btn-sm-purple" id="tab-equal" onclick="setMethod('equal')">⚖️ Égal</button>
        <button class="btn-sm" id="tab-rooms" onclick="setMethod('rooms')" style="background:rgba(255,255,255,0.1);color:#fff">🚪 Pièces</button>
        <button class="btn-sm" id="tab-pct" onclick="setMethod('pct')" style="background:rgba(255,255,255,0.1);color:#fff">% Custom</button>
      </div>
      <div id="parts-list"></div>
      <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span style="font-size:12px;color:rgba(255,255,255,0.5)">Total</span>
        <span style="font-size:18px;font-weight:800;color:#fff" id="calc-total-display">0 F</span>
      </div>
    </div>
    <button class="btn-primary" onclick="saveSplit()">💾 Enregistrer ce partage</button>
    <button class="btn-ghost" onclick="sendWhatsApp()" style="border-color:rgba(79,70,229,0.3);color:var(--purple);margin-top:8px">💬 Envoyer sur WhatsApp</button>
  </div>
</div>
</div>
<nav class="bottom-nav"><a class="bn-item" href="dashboard.html"><i class="ph ph-house-simple"></i><span>Accueil</span></a><a class="bn-item" href="bills.html"><i class="ph ph-file-text"></i><span>Factures</span></a><a class="bn-item bn-fab" href="upload.html"><div class="bn-fab-circle"><i class="ph ph-scan"></i></div><span>Scanner</span></a><a class="bn-item active" href="meter-split.html"><i class="ph-fill ph-lightning"></i><span>Partage</span></a><a class="bn-item" href="alerts.html"><i class="ph ph-bell"></i><span>Alertes</span></a></nav>
<div class="toast" id="toast"></div>

<!-- MODAL: New Group -->
<div class="modal-overlay" id="modal-group">
<div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-title">⚡ Nouveau groupe</div>
  <div class="form-group"><label class="form-label">Nom du groupe</label><input class="form-input" id="g-name" placeholder="Immeuble Akwa — ENEO"></div>
  <div class="form-grid" style="margin-bottom:14px">
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Société</label>
      <select class="form-input" id="g-co"><option value="ENEO">⚡ ENEO</option><option value="CamWater">💧 CamWater</option><option value="Camtel">📡 Camtel</option></select>
    </div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Méthode</label>
      <select class="form-input" id="g-method"><option value="equal">⚖️ Égal</option><option value="rooms">🚪 Pièces</option><option value="pct">% Custom</option></select>
    </div>
  </div>
  <div class="form-group"><label class="form-label">Adresse</label><input class="form-input" id="g-addr" placeholder="Rue Joss, Akwa"></div>
  <button class="btn-primary" onclick="saveGroup()">✅ Créer le groupe</button>
</div>
</div>

<!-- MODAL: Add Participant -->
<div class="modal-overlay" id="modal-part">
<div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-title">👤 Ajouter participant</div>
  <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="p-name" placeholder="Jean Nkemdirim"></div>
  <div class="form-grid" style="margin-bottom:14px">
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Téléphone</label><input class="form-input" id="p-phone" placeholder="+237 6XX XX XX XX"></div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Pièces</label><input class="form-input" type="number" id="p-rooms" value="1" min="1"></div>
  </div>
  <button class="btn-primary" onclick="saveParticipant()">➕ Ajouter</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPA_URL='https://rjnsnodvqwwhkxbznzqa.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnNub2R2cXd3aGt4YnpuenFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODg1OTksImV4cCI6MjA5Mzc2NDU5OX0.gkV9ynTFdY8B72s2fnRpTkUH71FUz59ICIpQLZQDsIc';
const db=supabase.createClient(SUPA_URL,SUPA_ANON);
let ME=null;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n||0).toLocaleString('fr-FR');
const fmtA=n=>fmt(n)+' F';
const fmtM=m=>m?new Date(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'—';
const fmtMs=m=>m?new Date(m+'-01').toLocaleDateString('fr-FR',{month:'short',year:'numeric'}):'—';
const fmtD=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const ini=n=>(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
const avCol=['av-purple','av-green','av-amber'];
function toast(msg,type='success'){const t=$('toast');t.innerHTML=msg;t.className='toast '+type+' show';setTimeout(()=>t.classList.remove('show'),3000)}
function openM(id){$(id).classList.add('open')}
function closeM(id){$(id).classList.remove('open')}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('open')});
async function initAuth(){const {data:{session}}=await db.auth.getSession();if(!session){window.location.href='auth.html';return null;}ME=session.user;return ME;}

let groups=[],parts=[],splits=[],activeGroup=null,method='equal';
const coIcon={ENEO:'⚡',CamWater:'💧',Camtel:'📡'};
const colors=['#4F46E5','#0284C7','#7C3AED','#10B981','#F59E0B','#EF4444','#EC4899','#14B8A6'];

window.addEventListener('DOMContentLoaded',async()=>{
  ME=await initAuth();if(!ME)return;
  await load();
});

async function load(){
  const [g,s]=await Promise.all([
    db.from('meter_groups').select('*').eq('owner_id',ME.id).order('created_at',{ascending:false}),
    db.from('meter_splits').select('*').eq('owner_id',ME.id)
  ]);
  groups=g.data||[];splits=s.data||[];
  $('s-groups').textContent=groups.length;
  $('s-splits').textContent=splits.length;
  renderGroups();
}

function renderGroups(){
  const el=$('groups-list');
  if(!groups.length){el.innerHTML=`<div class="empty-state"><span class="ei">⚡</span><h3>Aucun groupe</h3><p>Créez votre premier groupe de compteur partagé</p><button class="btn-sm btn-sm-purple" onclick="openM('modal-group')" style="margin-top:14px">+ Créer un groupe</button></div>`;return;}
  el.innerHTML=groups.map((g,i)=>`
    <div class="card" style="padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer" onclick="selectGroup('${g.id}')">
      <div class="li-icon" style="background:${coIcon[g.company]?'rgba(79,70,229,0.1)':'#F3F4F6'};font-size:22px">${coIcon[g.company]||'📌'}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:var(--text)">${g.name}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${g.company} · ${g.split_method==='equal'?'Partage égal':g.split_method==='rooms'?'Par pièces':'Pourcentage'}</div>
      </div>
      <i class="ph ph-caret-right" style="color:var(--text3);font-size:18px"></i>
    </div>`).join('');
}

async function selectGroup(id){
  activeGroup=groups.find(g=>g.id===id);
  if(!activeGroup)return;
  const {data}=await db.from('meter_participants').select('*').eq('group_id',id).eq('status','active');
  parts=data||[];
  method=activeGroup.split_method||'equal';
  $('calc-group-name').textContent=coIcon[activeGroup.company]+' '+activeGroup.name;
  $('calc-section').style.display='block';
  $('calc-section').scrollIntoView({behavior:'smooth'});
  setMethod(method);
}

function setMethod(m){
  method=m;
  ['equal','rooms','pct'].forEach(t=>{
    const btn=$('tab-'+t);
    if(btn){btn.className='btn-sm '+(t===m?'btn-sm-purple':'');if(t!==m)btn.style.cssText='background:rgba(255,255,255,0.1);color:#fff';}
  });
  recalc();
}

function recalc(){
  const total=parseFloat($('calc-total').value)||0;
  $('calc-total-display').textContent=fmt(total)+' F';
  if(!parts.length){$('parts-list').innerHTML=`<div style="text-align:center;padding:16px;color:rgba(255,255,255,0.4);font-size:13px">Aucun participant — <button onclick="openM('modal-part')" style="background:none;border:none;color:#818CF8;font-weight:600;cursor:pointer;font-size:13px">+ Ajouter</button></div>`;return;}
  let shares=[];
  if(method==='equal'){const ea=total/parts.length;shares=parts.map(p=>({...p,amount:ea,pct:100/parts.length}));}
  else if(method==='rooms'){const tr=parts.reduce((s,p)=>s+(p.rooms||1),0)||1;shares=parts.map(p=>{const r=p.rooms||1;return{...p,amount:total*r/tr,pct:r/tr*100}});}
  else{shares=parts.map(p=>{const pct=p.share_pct||Math.round(100/parts.length);return{...p,amount:total*pct/100,pct}});}
  $('parts-list').innerHTML=shares.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)">
      <div style="width:32px;height:32px;border-radius:50%;background:${colors[i%colors.length]}22;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:${colors[i%colors.length]};flex-shrink:0">${ini(p.name)}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:600;color:#fff">${p.name}</div><div style="font-size:11px;color:rgba(255,255,255,0.4)">${Math.round(p.pct)}%</div></div>
      <div style="font-size:15px;font-weight:800;color:${colors[i%colors.length]}">${fmtA(p.amount)}</div>
    </div>`).join('');
  window._currentShares=shares;
}

function sendWhatsApp(){
  const total=parseFloat($('calc-total').value)||0;
  if(!window._currentShares?.length)return toast('Calculez d'abord le partage','error');
  const lines=window._currentShares.map(p=>`• ${p.name}: *${fmtA(p.amount)}*`).join('\n');
  const msg=encodeURIComponent(`🛡 *BillSafe — Partage ${activeGroup?.company||''}*\n\n${lines}\n\n💰 Total: *${fmtA(total)}*\n\nMerci de payer votre part 🙏`);
  window.open('https://wa.me/?text='+msg,'_blank');
}

async function saveSplit(){
  if(!activeGroup)return;
  const total=parseFloat($('calc-total').value);
  if(!total)return toast('Entrez le montant','error');
  const {error}=await db.from('meter_splits').insert([{group_id:activeGroup.id,owner_id:ME.id,billing_month:new Date().toISOString().slice(0,7),total_amount:total,split_method:method,participant_splits:JSON.stringify(window._currentShares||[]),status:'active'}]);
  if(error)return toast('Erreur: '+error.message,'error');
  toast('✅ Partage enregistré!');await load();
}

async function saveGroup(){
  const name=$('g-name').value.trim();if(!name)return toast('Le nom est obligatoire','error');
  const {error}=await db.from('meter_groups').insert([{owner_id:ME.id,name,company:$('g-co').value,split_method:$('g-method').value,address:$('g-addr').value.trim()||null}]);
  if(error)return toast('Erreur: '+error.message,'error');
  closeM('modal-group');toast('✅ Groupe créé!');await load();
}

async function saveParticipant(){
  const name=$('p-name').value.trim();if(!name)return toast('Le nom est obligatoire','error');
  if(!activeGroup)return toast('Sélectionnez un groupe','error');
  const {error}=await db.from('meter_participants').insert([{group_id:activeGroup.id,owner_id:ME.id,name,phone:$('p-phone').value.trim()||null,rooms:parseInt($('p-rooms').value)||1,status:'active'}]);
  if(error)return toast('Erreur: '+error.message,'error');
  closeM('modal-part');toast('✅ Participant ajouté!');
  await selectGroup(activeGroup.id);
}
</script></body></html>
