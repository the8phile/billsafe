<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BillSafe">
<meta name="theme-color" content="#4F46E5">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.json">
<title>BillSafe — Mes Propriétés</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#4F46E5;--purple-dark:#3730A3;--purple-dim:rgba(79,70,229,0.1);
  --violet:#7C3AED;--blue:#2563EB;
  --bg:#F5F5FA;--surface:#FFFFFF;--surface2:#F8F8FF;
  --dark:#1E1B4B;--dark2:#312E81;
  --text:#1E1B4B;--text2:#6B7280;--text3:#9CA3AF;
  --green:#10B981;--green-bg:rgba(16,185,129,0.1);
  --red:#EF4444;--red-bg:rgba(239,68,68,0.1);
  --amber:#F59E0B;--amber-bg:rgba(245,158,11,0.1);
  --white:#FFFFFF;--nav-h:72px;
  --radius:20px;--radius-sm:14px;
  --shadow:0 2px 12px rgba(79,70,229,0.08);
  --f:'Inter',sans-serif;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:var(--nav-h)}
.app{min-height:100vh;max-width:430px;margin:0 auto}
@media(min-width:769px){.app{box-shadow:0 0 40px rgba(0,0,0,0.12)}}
.page-header{background:linear-gradient(145deg,#4F46E5 0%,#7C3AED 100%);padding:env(safe-area-inset-top,44px) 20px 28px;position:relative;overflow:hidden}
.page-header::before{content:'';position:absolute;top:-40px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,0.06);border-radius:50%}
.ph-row{display:flex;align-items:center;gap:14px;padding-top:8px;position:relative;z-index:1}
.back-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.page-title{font-size:18px;font-weight:700;color:#fff;flex:1}
.ph-action{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ph-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-top:4px;padding-left:52px;position:relative;z-index:1}
.content{padding:20px 16px}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-dark{background:linear-gradient(135deg,#1E1B4B,#312E81);color:#fff}
.card-purple{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
.card-dark .card-title,.card-purple .card-title{color:#fff}
.card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.05em}
.form-input{width:100%;padding:14px 16px;border:1.5px solid #E5E7EB;border-radius:var(--radius-sm);font-size:15px;font-family:var(--f);background:var(--surface2);color:var(--text);outline:none;transition:all 0.2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,0.1)}
select.form-input{cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;font-size:15px;font-weight:700;font-family:var(--f);border:none;border-radius:var(--radius-sm);cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,0.35);transition:all 0.2s;margin-top:6px}
.btn-primary:active{transform:scale(0.98)}
.btn-ghost{width:100%;padding:14px;background:transparent;border:1.5px solid #E5E7EB;color:var(--text2);font-size:14px;font-weight:600;font-family:var(--f);border-radius:var(--radius-sm);cursor:pointer;margin-top:8px}
.btn-sm{padding:9px 18px;border-radius:100px;font-size:13px;font-weight:700;font-family:var(--f);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:all 0.2s}
.btn-sm:active{transform:scale(0.95)}
.btn-sm-purple{background:var(--purple);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,0.3)}
.btn-sm-ghost{background:var(--purple-dim);color:var(--purple)}
.btn-sm-red{background:var(--red-bg);color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px}
.pill-paid{background:var(--green-bg);color:var(--green)}
.pill-pending{background:var(--amber-bg);color:var(--amber)}
.pill-active{background:var(--green-bg);color:var(--green)}
.pill-inactive{background:#F3F4F6;color:var(--text2)}
.li-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ic-eneo{background:linear-gradient(135deg,#FEF08A,#EAB308)}
.ic-camwater{background:linear-gradient(135deg,#BAE6FD,#0284C7)}
.ic-camtel{background:linear-gradient(135deg,#DDD6FE,#7C3AED)}
.ic-green{background:linear-gradient(135deg,#BBF7D0,#10B981)}
.ic-purple{background:linear-gradient(135deg,#E0E7FF,#4F46E5)}
.ic-amber{background:var(--amber-bg)}
.ic-gray{background:#F3F4F6}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.av-purple{background:var(--purple-dim);color:var(--purple)}
.av-green{background:var(--green-bg);color:var(--green)}
.av-amber{background:var(--amber-bg);color:var(--amber)}
.empty-state{text-align:center;padding:48px 24px}
.empty-state .ei{font-size:48px;margin-bottom:14px;display:block}
.empty-state h3{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text3);line-height:1.6}
.skeleton{background:linear-gradient(90deg,#F3F4F6 25%,#E9EAEC 50%,#F3F4F6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,44px)+8px);left:16px;right:16px;background:#1E1B4B;color:#fff;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.2);transform:translateY(-80px);opacity:0;transition:all 0.3s;z-index:9999;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:28px 28px 0 0;width:100%;padding:20px 20px 40px;transform:translateY(30px);transition:transform 0.3s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:#E5E7EB;border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:18px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;height:var(--nav-h);background:var(--white);border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:stretch;z-index:1000;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 24px rgba(0,0,0,0.08)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:var(--f);-webkit-tap-highlight-color:transparent;transition:color 0.15s;position:relative}
.bn-item.active{color:var(--purple)}
.bn-item.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--purple);border-radius:0 0 4px 4px}
.bn-item i{font-size:22px;transition:transform 0.15s}
.bn-item.active i{transform:scale(1.1)}
.bn-fab{flex:0 0 60px}
.bn-fab-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(79,70,229,0.45);border:3px solid #fff;position:relative;top:-10px}
.bn-fab-circle i{font-size:24px;color:#fff}
.bn-fab::before{display:none!important}


/* ═══════════════════════════════════════════════════════════
   PAGE TRANSITIONS — slide in from right, slide out to left
   ═══════════════════════════════════════════════════════════ */
@keyframes slideInRight {
  from { opacity:0; transform:translateX(32px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes slideOutLeft {
  from { opacity:1; transform:translateX(0); }
  to   { opacity:0; transform:translateX(-32px); }
}
@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-32px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes scaleIn {
  from { opacity:0; transform:scale(0.97); }
  to   { opacity:1; transform:scale(1); }
}

/* Page enters */
.page-enter {
  animation: slideInRight 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
/* Page exits */
.page-exit {
  animation: slideOutLeft 0.22s cubic-bezier(0.55,0,1,0.45) both;
  pointer-events: none;
}
/* Modal sheet enters */
.modal-enter {
  animation: fadeUp 0.3s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
/* Card stagger children */
.stagger-children > * {
  opacity: 0;
  animation: fadeUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.stagger-children > *:nth-child(1) { animation-delay:0.05s }
.stagger-children > *:nth-child(2) { animation-delay:0.10s }
.stagger-children > *:nth-child(3) { animation-delay:0.15s }
.stagger-children > *:nth-child(4) { animation-delay:0.20s }
.stagger-children > *:nth-child(5) { animation-delay:0.25s }
.stagger-children > *:nth-child(6) { animation-delay:0.30s }
.stagger-children > *:nth-child(7) { animation-delay:0.35s }
.stagger-children > *:nth-child(8) { animation-delay:0.40s }

/* Back transition (slide from left) */
.page-enter-back {
  animation: slideInLeft 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both;
}

/* Bottom nav tap ripple */
.bn-item { overflow:hidden; }
.nav-ripple {
  position:absolute;
  border-radius:50%;
  background:rgba(79,70,229,0.15);
  transform:scale(0);
  animation:navRipple 0.5s ease-out forwards;
  pointer-events:none;
}
@keyframes navRipple {
  to { transform:scale(3.5); opacity:0; }
}

/* Page overlay for transition */
#page-transition-overlay {
  position:fixed;inset:0;
  background:rgba(79,70,229,0.04);
  z-index:9000;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.15s;
}
#page-transition-overlay.active { opacity:1; }
</style></head><body>
<div class="app">
<div class="page-header">
  <div class="ph-row">
    <button class="back-btn" onclick="history.back()"><i class="ph ph-arrow-left"></i></button>
    <span class="page-title">🏢 Mes Propriétés</span>
    <button class="ph-action" onclick="openM('modal-prop')"><i class="ph ph-plus"></i></button>
  </div>
  <div class="ph-sub">Gérez vos propriétés et partagez des factures</div>
</div>
<div class="content">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--purple)" id="s-props">—</div><div style="font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">Propriétés</div></div>
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--green)" id="s-tenants">—</div><div style="font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">Locataires</div></div>
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--amber)" id="s-shared">—</div><div style="font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">Partagées</div></div>
  </div>
  <div id="props-list"><div class="skeleton" style="height:80px;margin-bottom:10px"></div><div class="skeleton" style="height:80px"></div></div>

  <!-- TENANTS -->
  <div style="font-size:15px;font-weight:700;color:var(--text);margin:16px 0 12px;display:flex;justify-content:space-between;align-items:center">
    Locataires
    <button class="btn-sm btn-sm-purple" onclick="openM('modal-tenant')">+ Ajouter</button>
  </div>
  <div id="tenants-list"><div class="skeleton" style="height:64px;margin-bottom:8px"></div><div class="skeleton" style="height:64px"></div></div>

  <button class="btn-primary" onclick="window.location.href='shared.html'" style="margin-top:6px">🔗 Gérer les factures partagées</button>
</div>
</div>
<nav class="bottom-nav"><a class="bn-item" href="dashboard.html"><i class="ph ph-house-simple"></i><span>Accueil</span></a><a class="bn-item" href="bills.html"><i class="ph ph-file-text"></i><span>Factures</span></a><a class="bn-item bn-fab" href="upload.html"><div class="bn-fab-circle"><i class="ph ph-scan"></i></div><span>Scanner</span></a><a class="bn-item" href="meter-split.html"><i class="ph ph-lightning"></i><span>Partage</span></a><a class="bn-item" href="alerts.html"><i class="ph ph-bell"></i><span>Alertes</span></a></nav>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-prop">
<div class="modal"><div class="modal-handle"></div><div class="modal-title">🏢 Nouvelle propriété</div>
  <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="p-name" placeholder="Immeuble Akwa Nord"></div>
  <div class="form-grid" style="margin-bottom:14px">
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Ville</label><input class="form-input" id="p-city" value="Douala"></div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Type</label>
      <select class="form-input" id="p-type"><option value="apartment">Appartement</option><option value="house">Maison</option><option value="commercial">Commercial</option></select>
    </div>
  </div>
  <div class="form-group"><label class="form-label">Adresse</label><input class="form-input" id="p-addr" placeholder="Rue Joss, Akwa"></div>
  <button class="btn-primary" onclick="saveProp()">💾 Créer</button>
</div></div>

<div class="modal-overlay" id="modal-tenant">
<div class="modal"><div class="modal-handle"></div><div class="modal-title">👤 Nouveau locataire</div>
  <div class="form-group"><label class="form-label">Nom complet</label><input class="form-input" id="t-name" placeholder="Marie Nkemdirim"></div>
  <div class="form-grid" style="margin-bottom:14px">
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Téléphone</label><input class="form-input" id="t-phone" placeholder="+237 6XX XX XX XX"></div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Date d'entrée</label><input class="form-input" type="date" id="t-date"></div>
  </div>
  <button class="btn-primary" onclick="saveTenant()">💾 Ajouter</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPA_URL='https://rjnsnodvqwwhkxbznzqa.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnNub2R2cXd3aGt4YnpuenFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODg1OTksImV4cCI6MjA5Mzc2NDU5OX0.gkV9ynTFdY8B72s2fnRpTkUH71FUz59ICIpQLZQDsIc';
const db=supabase.createClient(SUPA_URL,SUPA_ANON);
let ME=null;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n||0).toLocaleString('fr-FR');
const fmtA=n=>fmt(n)+' F';
const fmtM=m=>m?new Date(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'—';
const fmtMs=m=>m?new Date(m+'-01').toLocaleDateString('fr-FR',{month:'short',year:'numeric'}):'—';
const fmtD=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const ini=n=>(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
const avCol=['av-purple','av-green','av-amber'];
function toast(msg,type='success'){const t=$('toast');t.innerHTML=msg;t.className='toast '+type+' show';setTimeout(()=>t.classList.remove('show'),3000)}
function openM(id){$(id).classList.add('open')}
function closeM(id){$(id).classList.remove('open')}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('open')});
async function initAuth(){const {data:{session}}=await db.auth.getSession();if(!session){window.location.href='auth.html';return null;}ME=session.user;return ME;}

let props=[],tenants=[],shared=[];

window.addEventListener('DOMContentLoaded',async()=>{
  ME=await initAuth();if(!ME)return;
  $('t-date').value=new Date().toISOString().split('T')[0];
  await load();
});

async function load(){
  const [pRes,tRes,sRes]=await Promise.all([
    db.from('properties').select('*').eq('landlord_id',ME.id).order('created_at',{ascending:false}),
    db.from('tenants').select('*').eq('landlord_id',ME.id).order('created_at',{ascending:false}),
    db.from('shared_bills').select('*').eq('landlord_id',ME.id)
  ]);
  props=pRes.data||[];tenants=tRes.data||[];shared=sRes.data||[];
  $('s-props').textContent=props.length;
  $('s-tenants').textContent=tenants.filter(t=>t.status==='active').length;
  $('s-shared').textContent=shared.length;
  renderProps();renderTenants();
}

function renderProps(){
  const el=$('props-list');
  const icons={apartment:'🏢',house:'🏠',commercial:'🏪',villa:'🏡'};
  if(!props.length){el.innerHTML=`<div class="empty-state"><span class="ei">🏢</span><h3>Aucune propriété</h3><p>Ajoutez votre première propriété</p><button class="btn-sm btn-sm-purple" onclick="openM('modal-prop')" style="margin-top:14px">+ Ajouter</button></div>`;return;}
  el.innerHTML=props.map(p=>`
    <div class="card" style="padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <div class="li-icon ic-purple" style="font-size:22px">${icons[p.type]||'🏢'}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${p.name}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${p.address||''}${p.city?', '+p.city:''}</div>
      </div>
      <i class="ph ph-caret-right" style="color:var(--text3)"></i>
    </div>`).join('');
}

function renderTenants(){
  const el=$('tenants-list');
  if(!tenants.length){el.innerHTML=`<div class="empty-state"><span class="ei">👥</span><h3>Aucun locataire</h3><p>Ajoutez vos locataires</p></div>`;return;}
  const avCols=['av-purple','av-green','av-amber'];
  el.innerHTML=tenants.map((t,i)=>`
    <div class="card" style="padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div class="avatar ${avCols[i%3]}">${ini(t.full_name)}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${t.full_name}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${t.phone||'—'}</div>
      </div>
      <span class="pill ${t.status==='active'?'pill-active':'pill-inactive'}">${t.status==='active'?'✓ Actif':'Parti'}</span>
    </div>`).join('');
}

async function saveProp(){
  const name=$('p-name').value.trim();if(!name)return toast('Le nom est obligatoire','error');
  const {error}=await db.from('properties').insert([{landlord_id:ME.id,name,city:$('p-city').value.trim()||'Douala',type:$('p-type').value,address:$('p-addr').value.trim()||null}]);
  if(error)return toast('Erreur: '+error.message,'error');
  closeM('modal-prop');toast('🏢 Propriété créée!');await load();
}

async function saveTenant(){
  const name=$('t-name').value.trim();if(!name)return toast('Le nom est obligatoire','error');
  const {error}=await db.from('tenants').insert([{landlord_id:ME.id,full_name:name,phone:$('t-phone').value.trim()||null,move_in_date:$('t-date').value||null,status:'active'}]);
  if(error)return toast('Erreur: '+error.message,'error');
  closeM('modal-tenant');toast('👤 Locataire ajouté!');await load();
}
</script></body></html>
