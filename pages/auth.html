<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BillSafe">
<meta name="theme-color" content="#4F46E5">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>BillSafe — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#4F46E5;--purple2:#7C3AED;--bg:#0F1117;--card:#1A1D27;--border:rgba(255,255,255,0.1);--text:#fff;--text2:rgba(255,255,255,0.6);--red:#EF4444;--green:#10B981;--f:'Inter',sans-serif}
html,body{height:100%;font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}

/* HEADER */
.header{background:linear-gradient(145deg,#4F46E5,#7C3AED);padding:env(safe-area-inset-top,44px) 24px 32px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-40px;right:-30px;width:150px;height:150px;background:rgba(255,255,255,0.06);border-radius:50%}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;position:relative;z-index:1}
.brand-logo{width:42px;height:42px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px solid rgba(255,255,255,0.3)}
.brand-name{font-size:20px;font-weight:800;color:#fff}
.header h1{font-size:26px;font-weight:800;color:#fff;margin-bottom:6px;position:relative;z-index:1}
.header p{font-size:14px;color:rgba(255,255,255,0.65);position:relative;z-index:1}

/* BODY */
.body{flex:1;padding:24px 20px;padding-bottom:40px}

/* TABS */
.tabs{display:flex;background:rgba(255,255,255,0.06);border-radius:12px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:10px;border-radius:9px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--f);transition:all 0.2s}
.tab.active{background:#fff;color:#1E1B4B;box-shadow:0 2px 8px rgba(0,0,0,0.2)}

/* FORM */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.05em}
.form-input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.07);border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--f);color:#fff;outline:none;transition:all 0.2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--purple);background:rgba(79,70,229,0.1);box-shadow:0 0 0 4px rgba(79,70,229,0.15)}
.form-input::placeholder{color:rgba(255,255,255,0.3)}

/* BUTTON */
.btn-login{
  width:100%;padding:16px;margin-top:8px;
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  color:#fff;font-size:16px;font-weight:700;
  font-family:var(--f);border:none;border-radius:12px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(79,70,229,0.4);
  transition:all 0.2s;
  -webkit-appearance:none;
}
.btn-login:active{transform:scale(0.98);opacity:0.9}
.btn-login:disabled{opacity:0.6;pointer-events:none}
.btn-login.success{background:linear-gradient(135deg,#059669,#10B981);box-shadow:0 4px 20px rgba(16,185,129,0.4)}

/* MESSAGE */
.msg{display:none;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;text-align:center}
.msg.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#FCA5A5}
.msg.success{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#6EE7B7}

/* DIVIDER */
.divider{text-align:center;color:var(--text2);font-size:12px;margin:20px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}

/* FORGOT */
.forgot{text-align:center;margin-top:16px}
.forgot a{color:rgba(255,255,255,0.5);font-size:13px;text-decoration:none}
.forgot a:hover{color:#fff}

/* SPINNER */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <div class="brand-logo">🛡</div>
      <span class="brand-name">BillSafe</span>
    </div>
    <h1>Bon retour 👋</h1>
    <p>Connectez-vous pour accéder à vos factures</p>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- MESSAGE -->
    <div class="msg" id="msg"></div>

    <!-- EMAIL -->
    <div class="form-group">
      <label class="form-label">Adresse email</label>
      <input class="form-input" type="email" id="email" placeholder="vous@email.com" autocomplete="email" inputmode="email">
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <!-- CONFIRM (register only) -->
    <div class="form-group" id="confirm-group" style="display:none">
      <label class="form-label">Confirmer le mot de passe</label>
      <input class="form-input" type="password" id="confirm" placeholder="••••••••">
    </div>

    <!-- BUTTON -->
    <button class="btn-login" id="btn-login">Se connecter</button>

    <div class="forgot">
      <a href="#" onclick="resetPassword()">Mot de passe oublié ?</a>
    </div>

  </div>
</div>

<script>
// ── SUPABASE ──────────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(
  'https://rjnsnodvqwwhkxbznzqa.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnNub2R2cXd3aGt4YnpuenFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODg1OTksImV4cCI6MjA5Mzc2NDU5OX0.gkV9ynTFdY8B72s2fnRpTkUH71FUz59ICIpQLZQDsIc'
);

let mode = 'login';

// ── If already logged in → go to dashboard ────────────────────
db.auth.getSession().then(({ data: { session } }) => {
  if (session) go();
});

// ── SWITCH TAB ────────────────────────────────────────────────
function switchTab(m) {
  mode = m;
  document.getElementById('tab-login').classList.toggle('active', m === 'login');
  document.getElementById('tab-register').classList.toggle('active', m === 'register');
  document.getElementById('confirm-group').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('btn-login').textContent = m === 'login' ? 'Se connecter' : "S'inscrire";
  hideMsg();
}

// ── SHOW / HIDE MSG ───────────────────────────────────────────
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}
function hideMsg() {
  document.getElementById('msg').style.display = 'none';
}

// ── REDIRECT ──────────────────────────────────────────────────
function go() {
  window.location.href = '/pages/dashboard.html';
}

// ── LOGIN / REGISTER ──────────────────────────────────────────
async function doAuth() {
  hideMsg();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');

  if (!email)    return showMsg('Entrez votre email', 'error');
  if (!password) return showMsg('Entrez votre mot de passe', 'error');
  if (password.length < 6) return showMsg('Mot de passe trop court (min 6)', 'error');

  // Loading state
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + (mode === 'login' ? 'Connexion...' : 'Inscription...');

  try {
    if (mode === 'login') {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      // SUCCESS
      btn.className = 'btn-login success';
      btn.innerHTML = '✅ Connecté!';
      showMsg('✅ Connexion réussie!', 'success');
      setTimeout(go, 800);

    } else {
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) throw new Error('Les mots de passe ne correspondent pas');
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      btn.innerHTML = "S'inscrire";
      btn.disabled = false;
      showMsg('✅ Compte créé! Vérifiez votre email puis connectez-vous.', 'success');
      setTimeout(() => switchTab('login'), 2000);
    }

  } catch (e) {
    btn.innerHTML = mode === 'login' ? 'Se connecter' : "S'inscrire";
    btn.disabled = false;

    const m = e.message || '';
    if (m.includes('Invalid login credentials') || m.includes('invalid'))
      showMsg('❌ Email ou mot de passe incorrect', 'error');
    else if (m.includes('fetch') || m.includes('network') || m.includes('Failed'))
      showMsg('❌ Pas de connexion internet. Réessayez.', 'error');
    else if (m.includes('already registered'))
      showMsg('⚠️ Email déjà utilisé. Connectez-vous.', 'error');
    else
      showMsg('❌ ' + m, 'error');
  }
}

// ── RESET PASSWORD ────────────────────────────────────────────
async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) return showMsg('Entrez votre email d\'abord', 'error');
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://billsafe-iota.vercel.app/pages/auth.html'
  });
  if (error) return showMsg('Erreur: ' + error.message, 'error');
  showMsg('📧 Email de réinitialisation envoyé!', 'success');
}

// ── WIRE BUTTON ───────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', doAuth);

// Allow Enter key to submit
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAuth();
});
</script>
</body>
</html>
