<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillSafe — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --lime: #CAFF40; --dark: #0D0D0D; --dark2: #161616; --dark3: #222;
    --gray: #888; --white: #fff; --red: #ff5f5f; --green: #2a7a50;
    --font-h: 'Manrope', sans-serif; --font-b: 'DM Sans', sans-serif;
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { height: 100%; }
  body { font-family: var(--font-b); background: #F4F4F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  /* CARD */
  .card { background: var(--white); border-radius: 28px; width: 100%; max-width: 440px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.10); animation: slideUp 0.5s ease both; }
  @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  .card-header { background: var(--dark); padding: 36px 36px 28px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 36px; height: 36px; background: var(--lime); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand-name { font-family: var(--font-h); font-weight: 800; font-size: 18px; color: var(--white); }
  .card-header h1 { font-family: var(--font-h); font-weight: 700; font-size: 24px; color: var(--white); margin-bottom: 6px; }
  .card-header p { font-size: 14px; color: #888; line-height: 1.5; }

  .card-body { padding: 32px 36px; }

  /* TABS */
  .tabs { display: flex; background: #f0f0ec; border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
  .tab { flex: 1; text-align: center; padding: 9px; font-size: 14px; font-weight: 600; font-family: var(--font-h); border-radius: 7px; cursor: pointer; transition: all 0.2s; color: var(--gray); border: none; background: transparent; }
  .tab.active { background: var(--white); color: var(--dark); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  /* METHOD TOGGLE */
  .method-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .method-btn { flex: 1; padding: 10px; border: 1.5px solid #e5e5e5; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; font-family: var(--font-h); cursor: pointer; background: var(--white); color: var(--gray); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .method-btn.active { border-color: var(--dark); color: var(--dark); background: #fafafa; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; font-family: var(--font-h); color: var(--dark); margin-bottom: 6px; letter-spacing: 0.03em; }
  .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid #e8e8e8; border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font-b); background: #fafafa; color: var(--dark); outline: none; transition: all 0.2s; }
  .form-input:focus { border-color: var(--dark); background: var(--white); box-shadow: 0 0 0 4px rgba(13,13,13,0.06); }
  .phone-input-wrap { display: flex; gap: 8px; }
  .country-code { width: 90px; flex-shrink: 0; }

  /* OTP */
  .otp-wrap { display: flex; gap: 8px; justify-content: center; }
  .otp-input { width: 48px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; font-family: var(--font-h); border: 1.5px solid #e8e8e8; border-radius: var(--radius-sm); background: #fafafa; color: var(--dark); outline: none; transition: all 0.2s; }
  .otp-input:focus { border-color: var(--dark); background: var(--white); }

  /* BUTTON */
  .btn-submit { width: 100%; padding: 14px; background: var(--dark); color: var(--white); font-family: var(--font-h); font-weight: 700; font-size: 15px; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-submit:hover { background: #222; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit.loading { opacity: 0.7; pointer-events: none; }
  .btn-submit.lime { background: var(--lime); color: var(--dark); }
  .btn-submit.lime:hover { background: #b8e836; }

  /* DIVIDER */
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#ececec; }
  .divider span { font-size: 12px; color: var(--gray); }

  /* MESSAGES */
  .msg { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
  .msg.error { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; display: block; }
  .msg.success { background: #f0fff5; color: var(--green); border: 1px solid #c3f0d5; display: block; }

  .link-btn { background: none; border: none; font-size: 13px; color: var(--gray); cursor: pointer; text-decoration: underline; width: 100%; text-align: center; margin-top: 16px; font-family: var(--font-b); }
  .link-btn:hover { color: var(--dark); }

  /* STEP indicator */
  .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e5e5; transition: all 0.3s; }
  .step-dot.active { background: var(--dark); width: 24px; border-radius: 4px; }
  .step-label { font-size: 12px; color: var(--gray); font-family: var(--font-h); font-weight: 600; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="brand">
      <div class="brand-logo">🛡</div>
      <div class="brand-name">BillSafe</div>
    </div>
    <h1 id="card-title">Bon retour 👋</h1>
    <p id="card-sub">Connectez-vous pour accéder à vos factures</p>
  </div>

  <div class="card-body">
    <!-- TABS: Login / Register -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Connexion</button>
      <button class="tab" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- METHOD TOGGLE -->
    <div class="method-row">
      <button class="method-btn active" id="btn-email-method" onclick="switchMethod('email')">✉️ Email</button>
      <button class="method-btn" id="btn-phone-method" onclick="switchMethod('phone')">📱 Téléphone</button>
    </div>

    <!-- MESSAGE -->
    <div class="msg" id="msg"></div>

    <!-- ── EMAIL FORM ── -->
    <div id="email-form">
      <div class="form-group" id="name-group" style="display:none">
        <label class="form-label">Nom complet</label>
        <input class="form-input" type="text" id="full-name" placeholder="Jean Ndoumbe">
      </div>
      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input class="form-input" type="email" id="email" placeholder="jean@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••">
      </div>
      <div class="form-group hidden" id="confirm-group">
        <label class="form-label">Confirmer le mot de passe</label>
        <input class="form-input" type="password" id="confirm-password" placeholder="••••••••">
      </div>
      <button class="btn-submit" id="email-btn" onclick="handleEmail()">
        <span id="email-btn-text">Se connecter</span>
      </button>
    </div>

    <!-- ── PHONE FORM ── -->
    <div id="phone-form" class="hidden">
      <!-- Step 1: enter phone -->
      <div id="phone-step1">
        <div class="step-indicator">
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
          <span class="step-label">Étape 1 / 2 — Votre numéro</span>
        </div>
        <div class="form-group">
          <label class="form-label">Numéro de téléphone</label>
          <div class="phone-input-wrap">
            <select class="form-input country-code" id="country-code">
              <option value="+237">🇨🇲 +237</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+49">🇩🇪 +49</option>
            </select>
            <input class="form-input" type="tel" id="phone" placeholder="6 XX XX XX XX" style="flex:1">
          </div>
        </div>
        <button class="btn-submit" onclick="sendOTP()">
          <span>Envoyer le code SMS</span>
        </button>
      </div>

      <!-- Step 2: OTP -->
      <div id="phone-step2" class="hidden">
        <div class="step-indicator">
          <div class="step-dot"></div>
          <div class="step-dot active"></div>
          <span class="step-label">Étape 2 / 2 — Code reçu</span>
        </div>
        <p style="font-size:13px;color:var(--gray);margin-bottom:20px;line-height:1.6">
          Entrez le code à 6 chiffres envoyé au <strong id="phone-display" style="color:var(--dark)"></strong>
        </p>
        <div class="otp-wrap" id="otp-wrap">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
        </div>
        <button class="btn-submit lime" style="margin-top:20px" onclick="verifyOTP()">Vérifier le code</button>
        <button class="link-btn" onclick="document.getElementById('phone-step1').classList.remove('hidden');document.getElementById('phone-step2').classList.add('hidden')">← Changer de numéro</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG — REPLACE THESE ──────────────────────────────────
const SUPABASE_URL  = 'https://rjnsnodvqwwhkxbznzqa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnNub2R2cXd3aGt4YnpuenFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODg1OTksImV4cCI6MjA5Mzc2NDU5OX0.gkV9ynTFdY8B72s2fnRpTkUH71FUz59ICIpQLZQDsIc';
// ────────────────────────────────────────────────────────────

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

let currentTab = 'login';
let currentMethod = 'email';

// ── UI HELPERS ──────────────────────────────────────────────
function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
  el.textContent = '';
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.toggle('loading', loading);
}

// ── TAB SWITCH ──────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  clearMsg();
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('card-title').textContent = tab === 'login' ? 'Bon retour 👋' : 'Créer un compte';
  document.getElementById('card-sub').textContent = tab === 'login' ? 'Connectez-vous pour accéder à vos factures' : 'Rejoignez des milliers de Camerounais';
  document.getElementById('name-group').style.display = (tab === 'register' && currentMethod === 'email') ? 'block' : 'none';
  document.getElementById('confirm-group').classList.toggle('hidden', tab !== 'register');
  document.getElementById('email-btn-text').textContent = tab === 'login' ? 'Se connecter' : "S'inscrire";
}

// ── METHOD SWITCH ────────────────────────────────────────────
function switchMethod(method) {
  currentMethod = method;
  clearMsg();
  document.getElementById('btn-email-method').classList.toggle('active', method === 'email');
  document.getElementById('btn-phone-method').classList.toggle('active', method === 'phone');
  document.getElementById('email-form').classList.toggle('hidden', method !== 'email');
  document.getElementById('phone-form').classList.toggle('hidden', method !== 'phone');
  if (method === 'email') {
    document.getElementById('name-group').style.display = currentTab === 'register' ? 'block' : 'none';
  }
}

// ── EMAIL AUTH ───────────────────────────────────────────────
async function handleEmail() {
  clearMsg();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) return showMsg('Veuillez remplir tous les champs.');

  const btn = document.getElementById('email-btn');
  btn.classList.add('loading');
  btn.querySelector('span').textContent = 'Chargement...';

  try {
    if (currentTab === 'login') {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showMsg('Connexion réussie! Redirection...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } else {
      const confirm = document.getElementById('confirm-password').value;
      const name = document.getElementById('full-name').value.trim();
      if (password !== confirm) { btn.classList.remove('loading'); return showMsg('Les mots de passe ne correspondent pas.'); }
      if (!name) { btn.classList.remove('loading'); return showMsg('Veuillez entrer votre nom complet.'); }
      const { data: signUpData, error } = await db.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      if (error) throw error;

      // Try immediate session (email confirm disabled)
      if (signUpData.session) {
        showMsg('Compte créé! Redirection...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
        return;
      }
      // Fallback: try signing in right away
      const { data: siData } = await db.auth.signInWithPassword({ email, password });
      if (siData?.session) {
        showMsg('Compte créé! Redirection...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
        return;
      }
      showMsg('Compte créé! Vérifiez votre email, puis connectez-vous.', 'success');
    }
  } catch(e) {
    showMsg(e.message || 'Une erreur est survenue.');
  } finally {
    btn.classList.remove('loading');
    btn.querySelector('span').textContent = currentTab === 'login' ? 'Se connecter' : "S'inscrire";
  }
}

// ── PHONE OTP ────────────────────────────────────────────────
async function sendOTP() {
  clearMsg();
  const code = document.getElementById('country-code').value;
  const num  = document.getElementById('phone').value.trim().replace(/\s/g,'');
  if (!num) return showMsg('Veuillez entrer votre numéro de téléphone.');
  const fullPhone = code + num;

  try {
    const { error } = await db.auth.signInWithOtp({ phone: fullPhone });
    if (error) throw error;
    document.getElementById('phone-display').textContent = fullPhone;
    document.getElementById('phone-step1').classList.add('hidden');
    document.getElementById('phone-step2').classList.remove('hidden');
    showMsg('Code SMS envoyé avec succès!', 'success');
    document.querySelectorAll('.otp-input')[0].focus();
  } catch(e) {
    showMsg(e.message || 'Impossible d\'envoyer le SMS.');
  }
}

async function verifyOTP() {
  clearMsg();
  const digits = [...document.querySelectorAll('.otp-input')].map(i => i.value).join('');
  if (digits.length < 6) return showMsg('Entrez les 6 chiffres du code.');
  const code = document.getElementById('country-code').value;
  const num  = document.getElementById('phone').value.trim().replace(/\s/g,'');
  const fullPhone = code + num;
  try {
    const { error } = await db.auth.verifyOtp({ phone: fullPhone, token: digits, type: 'sms' });
    if (error) throw error;
    showMsg('Vérification réussie! Redirection...', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 800);
  } catch(e) {
    showMsg(e.message || 'Code incorrect. Réessayez.');
  }
}

// ── OTP auto-advance ─────────────────────────────────────────
document.querySelectorAll('.otp-input').forEach((input, i, all) => {
  input.addEventListener('input', () => {
    if (input.value && i < all.length - 1) all[i+1].focus();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !input.value && i > 0) all[i-1].focus();
  });
});

// ── Check if already logged in + listen for auth changes ────
db.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'dashboard.html';
});

db.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'USER_UPDATED')) {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
