<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --lime: #0052FF; --primary: #0052FF; --primary-dark: #003EC7; --dark: #283044; --dark2: #161616; --dark3: #222;
    --gray: #888; --white: #fff; --red: #ff5f5f; --green: #2a7a50;
    --font-h: 'Inter', sans-serif; --font-b: 'Inter', sans-serif;
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { height: 100%; }
  body { font-family: var(--font-b); background: #FAF8FF; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  /* CARD */
  .card { background: var(--white); border-radius: 28px; width: 100%; max-width: 440px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.10); animation: slideUp 0.5s ease both; }
  @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  .card-header { background: var(--dark, #283044); padding: 36px 36px 28px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 36px; height: 36px; background: var(--lime); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand-name { font-family: var(--font-h); font-weight: 800; font-size: 18px; color: var(--white); }
  .card-header h1 { font-family: var(--font-h); font-weight: 700; font-size: 24px; color: var(--white); margin-bottom: 6px; }
  .card-header p { font-size: 14px; color: #888; line-height: 1.5; }

  .card-body { padding: 32px 36px; }

  /* TABS */
  .tabs { display: flex; background: #f0f0ec; border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
  .tab { flex: 1; text-align: center; padding: 9px; font-size: 14px; font-weight: 600; font-family: var(--font-h); border-radius: 7px; cursor: pointer; transition: all 0.2s; color: var(--gray); border: none; background: transparent; }
  .tab.active { background: var(--white); color: var(--dark); box-shadow: 0 2px 8px rgba(0,82,255,0.1); }

  /* METHOD TOGGLE */
  .method-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .method-btn { flex: 1; padding: 10px; border: 1.5px solid #e5e5e5; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; font-family: var(--font-h); cursor: pointer; background: var(--white); color: var(--gray); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .method-btn.active { border-color: var(--dark); color: var(--dark); background: #fafafa; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; font-family: var(--font-h); color: var(--dark); margin-bottom: 6px; letter-spacing: 0.03em; }
  .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid #e8e8e8; border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font-b); background: #fafafa; color: var(--dark); outline: none; transition: all 0.2s; }
  .form-input:focus { border-color: var(--dark); background: var(--white); box-shadow: 0 0 0 4px rgba(13,13,13,0.06); }
  .phone-input-wrap { display: flex; gap: 8px; }
  .country-code { width: 90px; flex-shrink: 0; }

  /* OTP */
  .otp-wrap { display: flex; gap: 8px; justify-content: center; }
  .otp-input { width: 48px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; font-family: var(--font-h); border: 1.5px solid #e8e8e8; border-radius: var(--radius-sm); background: #fafafa; color: var(--dark); outline: none; transition: all 0.2s; }
  .otp-input:focus { border-color: var(--primary); background: var(--white); }

  /* BUTTON */
  .btn-submit { width: 100%; padding: 14px; background: var(--dark); color: var(--white); font-family: var(--font-h); font-weight: 700; font-size: 15px; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-submit:hover { background: #222; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit.loading { opacity: 0.7; pointer-events: none; }
  .btn-submit.lime { background: var(--primary); color: #fff; }
  .btn-submit.lime:hover { background: var(--primary-dark); }

  /* DIVIDER */
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#ececec; }
  .divider span { font-size: 12px; color: var(--gray); }

  /* MESSAGES */
  .msg { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
  .msg.error { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; display: block; }
  .msg.success { background: #f0fff5; color: var(--green); border: 1px solid #c3f0d5; display: block; }

  .link-btn { background: none; border: none; font-size: 13px; color: var(--gray); cursor: pointer; text-decoration: underline; width: 100%; text-align: center; margin-top: 16px; font-family: var(--font-b); }
  .link-btn:hover { color: var(--dark); }

  /* STEP indicator */
  .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e5e5; transition: all 0.3s; }
  .step-dot.active { background: var(--dark); width: 24px; border-radius: 4px; }
  .step-label { font-size: 12px; color: var(--gray); font-family: var(--font-h); font-weight: 600; }

  .hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════
   PAGE TRANSITIONS — slide in from right, slide out to left
   ═══════════════════════════════════════════════════════════ */
@keyframes slideInRight {
  from { opacity:0; transform:translateX(32px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes slideOutLeft {
  from { opacity:1; transform:translateX(0); }
  to   { opacity:0; transform:translateX(-32px); }
}
@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-32px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes scaleIn {
  from { opacity:0; transform:scale(0.97); }
  to   { opacity:1; transform:scale(1); }
}

/* Page enters */
.page-enter {
  animation: slideInRight 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
/* Page exits */
.page-exit {
  animation: slideOutLeft 0.22s cubic-bezier(0.55,0,1,0.45) both;
  pointer-events: none;
}
/* Modal sheet enters */
.modal-enter {
  animation: fadeUp 0.3s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
/* Card stagger children */
.stagger-children > * {
  opacity: 0;
  animation: fadeUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.stagger-children > *:nth-child(1) { animation-delay:0.05s }
.stagger-children > *:nth-child(2) { animation-delay:0.10s }
.stagger-children > *:nth-child(3) { animation-delay:0.15s }
.stagger-children > *:nth-child(4) { animation-delay:0.20s }
.stagger-children > *:nth-child(5) { animation-delay:0.25s }
.stagger-children > *:nth-child(6) { animation-delay:0.30s }
.stagger-children > *:nth-child(7) { animation-delay:0.35s }
.stagger-children > *:nth-child(8) { animation-delay:0.40s }

/* Back transition (slide from left) */
.page-enter-back {
  animation: slideInLeft 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both;
}

/* Bottom nav tap ripple */
.bn-item { overflow:hidden; }
.nav-ripple {
  position:absolute;
  border-radius:50%;
  background:rgba(79,70,229,0.15);
  transform:scale(0);
  animation:navRipple 0.5s ease-out forwards;
  pointer-events:none;
}
@keyframes navRipple {
  to { transform:scale(3.5); opacity:0; }
}

/* Page overlay for transition */
#page-transition-overlay {
  position:fixed;inset:0;
  background:rgba(79,70,229,0.04);
  z-index:9000;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.15s;
}
#page-transition-overlay.active { opacity:1; }
</style>

<body>
<div class="card">
  <div class="card-header">

    </div>

  <div class="card-body">
    <!-- TABS: Login / Register -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Connexion</button>
      <button class="tab" onclick="switchTab('register')">Inscription</button>

    <!-- METHOD TOGGLE -->
    <div class="method-row">

          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
          <input class="otp-input" maxlength="1" type="text" inputmode="numeric">

        <button class="btn-submit lime" style="margin-top:20px" onclick="verifyOTP()">Vérifier le code</button>
        <button class="link-btn" onclick="document.getElementById('phone-step1').classList.remove('hidden');document.getElementById('phone-step2').classList.add('hidden')">← Changer de numéro</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG ────────────────────────────────────────────────────
// Allowed URLs in Supabase: billsafe-iota.vercel.app + lighthearted-clafoutis-5bf7db.netlify.app
// ──────────────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://rjnsnodvqwwhkxbznzqa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnNub2R2cXd3aGt4YnpuenFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODg1OTksImV4cCI6MjA5Mzc2NDU5OX0.gkV9ynTFdY8B72s2fnRpTkUH71FUz59ICIpQLZQDsIc';
// ────────────────────────────────────────────────────────────

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

let currentTab = 'login';
let currentMethod = 'email';

// ── UI HELPERS ──────────────────────────────────────────────
function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
  el.textContent = '';
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.toggle('loading', loading);
}

// ── TAB SWITCH ──────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  clearMsg();
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('card-title').textContent = tab === 'login' ? 'Bon retour 👋' : 'Créer un compte';
  document.getElementById('card-sub').textContent = tab === 'login' ? 'Connectez-vous pour accéder à vos factures' : 'Rejoignez des milliers de Camerounais';
  document.getElementById('name-group').style.display = (tab === 'register' && currentMethod === 'email') ? 'block' : 'none';
  document.getElementById('confirm-group').classList.toggle('hidden', tab !== 'register');
  document.getElementById('email-btn-text').textContent = tab === 'login' ? 'Se connecter' : "S'inscrire";
}

// ── METHOD SWITCH ────────────────────────────────────────────
function switchMethod(method) {
  currentMethod = method;
  clearMsg();
  document.getElementById('btn-email-method').classList.toggle('active', method === 'email');
  document.getElementById('btn-phone-method').classList.toggle('active', method === 'phone');
  document.getElementById('email-form').classList.toggle('hidden', method !== 'email');
  document.getElementById('phone-form').classList.toggle('hidden', method !== 'phone');
  if (method === 'email') {
    document.getElementById('name-group').style.display = currentTab === 'register' ? 'block' : 'none';
  }
}

// ── EMAIL AUTH ───────────────────────────────────────────────
async function handleEmail() {
  clearMsg();

  const emailEl = document.getElementById('email');
  const passEl  = document.getElementById('password');
  if (!emailEl || !passEl) return showMsg('Erreur de formulaire. Rechargez la page.');

  const email    = emailEl.value.trim();
  const password = passEl.value;

  if (!email)    return showMsg('Veuillez entrer votre email.');
  if (!password) return showMsg('Veuillez entrer votre mot de passe.');

  const btn     = document.getElementById('email-btn');
  const btnText = document.getElementById('email-btn-text') || btn.querySelector('span') || btn;

  btn.disabled = true;
  btn.classList.add('loading');
  btnText.textContent = 'Connexion en cours...';

  try {
    if (currentTab === 'login') {
      const { data: loginData, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      // Success — redirect immediately
      window._redirecting = true;
      showMsg('✅ Connexion réussie!', 'success');
      btnText.textContent = '✅ Connecté!';
      btn.style.background = 'linear-gradient(135deg,#059669,#10B981)';
      if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
      window.location.href = '/pages/dashboard.html';
    } else {
      const confirm = document.getElementById('confirm-password').value;
      const name = document.getElementById('full-name').value.trim();
      if (password !== confirm) { btn.classList.remove('loading'); return showMsg('Les mots de passe ne correspondent pas.'); }
      if (!name) { btn.classList.remove('loading'); return showMsg('Veuillez entrer votre nom complet.'); }
      const { data: signUpData, error } = await db.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      if (error) throw error;

      // Try immediate session (email confirm disabled)
      if (signUpData.session) {
        showMsg('Compte créé! Redirection...', 'success');
        setTimeout(() => { window.location.replace('/pages/dashboard.html'); }, 600);
        return;
      }
      // Fallback: try signing in right away
      const { data: siData } = await db.auth.signInWithPassword({ email, password });
      if (siData?.session) {
        showMsg('Compte créé! Redirection...', 'success');
        setTimeout(() => { window.location.replace('/pages/dashboard.html'); }, 600);
        return;
      }
      showMsg('Compte créé! Vérifiez votre email, puis connectez-vous.', 'success');
    }
  } catch(e) {
    btn.disabled = false;
    btn.classList.remove('loading');
    btnText.textContent = currentTab === 'login' ? 'Se connecter' : "S'inscrire";
    const msg = e.message || '';
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('fetch')) {
      showMsg('❌ Connexion impossible au serveur. Réessayez dans 30 secondes.', 'error');
      document.getElementById('server-banner').style.display = 'block';
      // Auto-retry after 30s
      let countdown = 30;
      const retryInterval = setInterval(() => {
        countdown--;
        const btn2 = document.getElementById('email-btn');
        const sp2  = btn2 && (btn2.querySelector('span') || btn2);
        if (btn2 && countdown > 0) {
          if (sp2) sp2.textContent = `Réessayer dans ${countdown}s...`;
          btn2.disabled = true;
        } else {
          clearInterval(retryInterval);
          if (btn2) {
            if (sp2) sp2.textContent = 'Se connecter';
            btn2.disabled = false;
            const sb = document.getElementById('server-banner');
            if (sb) sb.innerHTML += '<br><strong style="color:green">✅ Prêt — Cliquez sur Se connecter</strong>';
          }
        }
      }, 1000);
    } else if (msg.includes('Invalid login credentials') || msg.includes('invalid_credentials') || msg.includes('Invalid')) {
      showMsg('❌ Email ou mot de passe incorrect.\nEmail: basicvest1@gmail.com\nMot de passe: 677632469', 'error');
    } else if (msg.includes('Email not confirmed')) {
      showMsg('📧 Votre email n\'est pas encore confirmé. Vérifiez votre boîte mail et cliquez sur le lien de confirmation.', 'error');
    } else if (msg.includes('Too many requests') || msg.includes('rate limit')) {
      showMsg('⏳ Trop de tentatives. Attendez quelques minutes et réessayez.', 'error');
    } else if (msg.includes('User already registered')) {
      showMsg('⚠️ Cet email est déjà utilisé. Essayez de vous connecter à la place.', 'error');
    } else {
      showMsg('❌ ' + (msg || 'Une erreur est survenue. Réessayez.'), 'error');
    }
  } finally {
    if (!window._redirecting) {
      btn.disabled = false;
      btn.classList.remove('loading');
      const bts = document.getElementById('email-btn-text') || btn.querySelector('span') || btn;
      bts.textContent = currentTab === 'login' ? 'Se connecter' : "S'inscrire";
    }
  }
}

// ── PHONE OTP ────────────────────────────────────────────────
async function sendOTP() {
  clearMsg();
  const code = document.getElementById('country-code').value;
  const num  = document.getElementById('phone').value.trim().replace(/\s/g,'');
  if (!num) return showMsg('Veuillez entrer votre numéro de téléphone.');
  const fullPhone = code + num;

  try {
    const { error } = await db.auth.signInWithOtp({ phone: fullPhone });
    if (error) throw error;
    document.getElementById('phone-display').textContent = fullPhone;
    document.getElementById('phone-step1').classList.add('hidden');
    document.getElementById('phone-step2').classList.remove('hidden');
    showMsg('Code SMS envoyé avec succès!', 'success');
    document.querySelectorAll('.otp-input')[0].focus();
  } catch(e) {
    showMsg(e.message || 'Impossible d\'envoyer le SMS.');
  }
}

async function verifyOTP() {
  clearMsg();
  const digits = [...document.querySelectorAll('.otp-input')].map(i => i.value).join('');
  if (digits.length < 6) return showMsg('Entrez les 6 chiffres du code.');
  const code = document.getElementById('country-code').value;
  const num  = document.getElementById('phone').value.trim().replace(/\s/g,'');
  const fullPhone = code + num;
  try {
    const { error } = await db.auth.verifyOtp({ phone: fullPhone, token: digits, type: 'sms' });
    if (error) throw error;
    showMsg('Vérification réussie! Redirection...', 'success');
    setTimeout(() => { window.location.replace('/pages/dashboard.html'); }, 600);
  } catch(e) {
    showMsg(e.message || 'Code incorrect. Réessayez.');
  }
}

// ── OTP auto-advance ─────────────────────────────────────────
document.querySelectorAll('.otp-input').forEach((input, i, all) => {
  input.addEventListener('input', () => {
    if (input.value && i < all.length - 1) all[i+1].focus();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !input.value && i > 0) all[i-1].focus();
  });
});

// ── Check if already logged in + listen for auth changes ────
db.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.replace('/pages/dashboard.html');
});

db.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'USER_UPDATED')) {
    window.location.replace('/pages/dashboard.html');
  }
});

// ═══════════════════════════════════════════════════════════
//  BIOMETRIC AUTH — Face ID / Fingerprint / Touch ID
//  Uses WebAuthn (Passkeys) — works on Safari iOS, Chrome Android
// ═══════════════════════════════════════════════════════════

const BIO_KEY = 'billsafe_bio_credential';
const BIO_USER_KEY = 'billsafe_bio_email';

// Check if WebAuthn is supported on this device
async function checkBiometricSupport() {
  const section = document.getElementById('bio-section');
  if (!section) return;

  // Need: HTTPS + PublicKeyCredential API + authenticator
  if (!window.PublicKeyCredential) {
    section.style.display = 'none';
    return;
  }

  try {
    const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (available) {
      section.style.display = 'block';
      // Detect what type of biometric
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad/.test(ua);
      const isMac = /Mac/.test(ua) && !isIOS;
      const isAndroid = /Android/.test(ua);
      const bioIcon = document.getElementById('bio-icon');
      const bioTitle = document.getElementById('bio-title');
      const bioSub = document.getElementById('bio-sub');

      if (isIOS) {
        bioIcon.textContent = '👤';
        bioTitle.textContent = 'Connexion avec Face ID';
        bioSub.textContent = 'Ou Touch ID selon votre iPhone';
      } else if (isMac) {
        bioIcon.textContent = '👆';
        bioTitle.textContent = 'Connexion avec Touch ID';
        bioSub.textContent = 'Capteur d'empreinte Mac';
      } else if (isAndroid) {
        bioIcon.textContent = '🔏';
        bioTitle.textContent = 'Connexion biométrique';
        bioSub.textContent = 'Empreinte digitale Android';
      }

      // If already registered, show as primary option
      const savedEmail = localStorage.getItem(BIO_USER_KEY);
      const savedCred = localStorage.getItem(BIO_KEY);
      if (savedEmail && savedCred) {
        bioSub.textContent = savedEmail;
      }
    }
  } catch(e) {
    console.log('Biometric check failed:', e);
  }
}

async function triggerBiometric() {
  const btn = document.getElementById('bio-btn');
  const savedEmail = localStorage.getItem(BIO_USER_KEY);
  const savedCred = localStorage.getItem(BIO_KEY);

  // Ripple effect
  const ripple = document.createElement('span');
  ripple.className = 'bio-ripple';
  ripple.style.cssText = 'width:100px;height:100px;left:calc(50% - 50px);top:calc(50% - 50px)';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);

  if (savedCred) {
    // ── AUTHENTICATE with existing passkey ──
    await authenticateWithPasskey();
  } else {
    // ── REGISTER new passkey (need email first) ──
    const email = document.getElementById('email')?.value?.trim();
    if (!email) {
      showMsg('Entrez votre email d'abord, puis activez la biométrie', 'error');
      document.getElementById('email')?.focus();
      return;
    }
    await registerPasskey(email);
  }
}

async function registerPasskey(email) {
  const btn = document.getElementById('bio-btn');
  const origHTML = btn.innerHTML;
  btn.innerHTML = '<span class="bio-icon">⏳</span><span class="bio-text"><span class="bio-title">Activation...</span><span class="bio-sub">Suivez les instructions</span></span>';
  btn.disabled = true;

  try {
    // Create a passkey challenge
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const userId = new TextEncoder().encode(email);

    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'BillSafe', id: window.location.hostname === 'localhost' ? 'localhost' : window.location.hostname },
        user: { id: userId, name: email, displayName: email.split('@')[0] },
        pubKeyCredParams: [
          { alg: -7, type: 'public-key' },   // ES256
          { alg: -257, type: 'public-key' },  // RS256
        ],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',  // Device biometrics only
          userVerification: 'required',          // Must use biometrics
          requireResidentKey: true,
        },
        timeout: 60000,
      }
    });

    // Save credential ID locally
    const credId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
    localStorage.setItem(BIO_KEY, credId);
    localStorage.setItem(BIO_USER_KEY, email);

    // Flash success
    const flash = document.createElement('div');
    flash.className = 'bio-success-flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 400);

    showMsg('✅ Biométrie activée! Reconnectez-vous avec votre empreinte.', 'success');
    btn.innerHTML = '<span class="bio-icon">✅</span><span class="bio-text"><span class="bio-title">Biométrie activée</span><span class="bio-sub">' + email + '</span></span>';
    btn.disabled = false;

  } catch(e) {
    btn.innerHTML = origHTML;
    btn.disabled = false;
    if (e.name === 'NotAllowedError') {
      showMsg('Biométrie annulée ou refusée. Réessayez.', 'error');
    } else if (e.name === 'SecurityError') {
      showMsg('Biométrie disponible uniquement sur HTTPS', 'error');
    } else {
      showMsg('Erreur biométrique: ' + e.message, 'error');
    }
  }
}

async function authenticateWithPasskey() {
  const btn = document.getElementById('bio-btn');
  const savedEmail = localStorage.getItem(BIO_USER_KEY);
  const origHTML = btn.innerHTML;
  btn.innerHTML = '<span class="bio-icon">⏳</span><span class="bio-text"><span class="bio-title">Vérification...</span><span class="bio-sub">Posez votre doigt / regardez</span></span>';
  btn.disabled = true;

  try {
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        userVerification: 'required',
        timeout: 60000,
      }
    });

    if (assertion) {
      // Passkey verified — now sign in with Supabase using saved email
      // In production: verify assertion on server. Here we use stored session.
      const { data: { session } } = await db.auth.getSession();

      if (session) {
        // Already have a session — go straight to dashboard
        showBioSuccess(savedEmail);
        setTimeout(() => { window.location.replace('/pages/dashboard.html'); }, 800);
        return;
      }

      // No active session — prompt for password once then remember
      const pw = document.getElementById('password')?.value?.trim();
      if (pw) {
        const { error } = await db.auth.signInWithPassword({ email: savedEmail, password: pw });
        if (error) throw error;
        showBioSuccess(savedEmail);
        setTimeout(() => { window.location.replace('/pages/dashboard.html'); }, 800);
      } else {
        // Fill email and ask for password
        if (document.getElementById('email')) document.getElementById('email').value = savedEmail;
        showMsg('✅ Biométrie OK! Entrez votre mot de passe pour terminer.', 'success');
        document.getElementById('password')?.focus();
        btn.innerHTML = origHTML;
        btn.disabled = false;
      }
    }
  } catch(e) {
    btn.innerHTML = origHTML;
    btn.disabled = false;
    if (e.name === 'NotAllowedError') {
      showMsg('Authentification annulée. Réessayez.', 'error');
    } else {
      showMsg('Échec de la biométrie. Utilisez votre mot de passe.', 'error');
    }
  }
}

function showBioSuccess(email) {
  const btn = document.getElementById('bio-btn');
  btn.innerHTML = '<span class="bio-icon">✅</span><span class="bio-text"><span class="bio-title">Identité confirmée</span><span class="bio-sub">' + (email || '') + '</span></span>';
  btn.style.borderColor = '#0052FF';
  btn.style.background = 'rgba(0,82,255,0.05)';
  const flash = document.createElement('div');
  flash.className = 'bio-success-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 400);
}

// Show biometric option when email is typed (to register)
document.addEventListener('DOMContentLoaded', () => {
  checkBiometricSupport();

  const emailInput = document.getElementById('email');
  if (emailInput) {
    emailInput.addEventListener('blur', () => {
      const hasSaved = localStorage.getItem(BIO_KEY);
      const section = document.getElementById('bio-section');
      if (section && section.style.display !== 'none' && !hasSaved) {
        const sub = document.getElementById('bio-sub');
        if (sub && emailInput.value) sub.textContent = 'Activer pour ' + emailInput.value;
      }
    });
  }
});
